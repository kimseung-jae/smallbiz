<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .poster {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #111;
  }
  .poster img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.08) saturate(1.15);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 32%, rgba(0,0,0,0.05) 62%, rgba(0,0,0,0.25) 100%);
  }
  .store-badge {
    position: absolute;
    top: 40px;
    left: 40px;
    background: #fff;
    color: #1a1a1a;
    font-weight: 800;
    font-size: 28px;
    padding: 12px 26px;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    letter-spacing: 1px;
  }
  .text-block {
    position: absolute;
    left: 50px;
    right: 50px;
    bottom: 60px;
    color: #fff;
  }
  .headline {
    font-size: __HEADLINE_SIZE__px;
    font-weight: 900;
    line-height: 1.22;
    white-space: pre-wrap;
    word-break: keep-all;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .accent-line {
    width: 90px;
    height: 8px;
    background: #ffd23f;
    margin: 22px 0;
    border-radius: 4px;
  }
  .subtext {
    font-size: 32px;
    font-weight: 600;
    color: #f0f0f0;
    white-space: pre-wrap;
    word-break: keep-all;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <img src="__PHOTO__" />
    <div class="overlay"></div>
    __STORE_BADGE__
    <div class="text-block">
      <div class="headline">__HEADLINE__</div>
      <div class="accent-line"></div>
      __SUBTEXT__
    </div>
  </div>
</body>
</html>
