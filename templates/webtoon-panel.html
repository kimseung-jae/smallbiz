<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif; background: #fdf8ee; }
  .page {
    width: 1080px;
    padding: 28px;
    background: #fdf8ee;
    background-image: radial-gradient(rgba(0,0,0,0.12) 1.4px, transparent 1.4px);
    background-size: 14px 14px;
    display: grid;
    gap: 18px;
    grid-template-columns: __GRID_COLS__;
    grid-template-rows: __GRID_ROWS__;
    grid-template-areas: __GRID_AREAS__;
  }
  .panel {
    position: relative;
    overflow: hidden;
    border: 7px solid #1a1a1a;
    background: #000;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.18);
  }
  .panel img, .panel video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.18) saturate(1.35);
  }
  .panel::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.85) 1px, transparent 1.4px);
    background-size: 5px 5px;
    mix-blend-mode: multiply;
    opacity: 0.22;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    max-width: 78%;
    background: #fff;
    border: 5px solid #1a1a1a;
    border-radius: 20px 24px 22px 16px;
    padding: 14px 20px;
    font-size: 32px;
    font-weight: 800;
    line-height: 1.32;
    color: #1a1a1a;
    white-space: pre-wrap;
    word-break: keep-all;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
  }
  .bubble.top { top: 18px; left: 18px; transform: rotate(-1.5deg); }
  .bubble.bottom { bottom: 18px; right: 18px; transform: rotate(1.5deg); }
  .bubble::after {
    content: '';
    position: absolute;
    width: 0; height: 0;
    border: 15px solid transparent;
  }
  .bubble.top::after { border-top-color: #1a1a1a; top: 100%; left: 26px; }
  .bubble.bottom::after { border-bottom-color: #1a1a1a; bottom: 100%; right: 26px; }

  .sticker {
    position: absolute;
    top: -18px;
    right: -18px;
    width: 110px;
    height: 110px;
    background: #ffd23f;
    border: 5px solid #1a1a1a;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #1a1a1a;
    text-align: center;
    transform: rotate(8deg);
    z-index: 5;
  }

  .title-bar {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    color: #1a1a1a;
    padding: 4px 0 6px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="page">
    __TITLE_BAR__
    __PANELS__
  </div>
</body>
</html>
