<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>바쁜 소상공인들을 위한 마케팅 선물세트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">바쁜 소상공인들을 위한 마케팅 선물세트</div>
    <div class="tagline">사진만 넣으면, AI가 포스터·릴스를 만들어드려요</div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 class="step-title">1. 매장 위치 찾기 <span class="hint">(네이버 지도에서 검색)</span></h2>
      <label class="field">
        <span>매장명 또는 주소로 검색</span>
        <div class="search-row">
          <input type="text" id="mapSearchInput" placeholder="예: 안마을돼지불백 남양주" />
          <button type="button" class="search-btn" id="mapSearchBtn">검색</button>
        </div>
      </label>
      <div id="mapEl" class="map-el"></div>
      <button type="button" class="secondary-btn" id="useMyLocationBtn">📍 내 위치로 보기</button>
      <div id="mapResultInfo" class="map-result-info"></div>
      <div id="nearbyRecoArea" class="nearby-reco"></div>
    </section>

    <section class="card">
      <h2 class="step-title">2. 사진 올리기 <span class="hint">(1~6장, 대표 사진이 맨 앞)</span></h2>
      <label class="upload-box" id="uploadBox">
        <input type="file" id="photoInput" accept="image/*,video/*" multiple hidden />
        <div class="upload-empty" id="uploadEmpty">
          <div class="upload-icon">📷</div>
          <div>탭해서 사진/영상 선택</div>
        </div>
        <div class="preview-row" id="previewRow"></div>
      </label>
      <div class="image-source-block">
        <div class="image-source-title">🔎 실제 웹 이미지 (매장명 기준 검색)</div>
        <button type="button" class="secondary-btn" id="realImageBtn">매장명으로 실제 이미지 찾기</button>
        <div class="tab-row" id="realImageTabs" hidden>
          <button type="button" class="tab-btn active" data-tab="naver">네이버</button>
          <button type="button" class="tab-btn" data-tab="daum">다음</button>
        </div>
        <div id="realImageArea" class="web-image-grid"></div>
      </div>

      <div class="image-source-block">
        <div class="image-source-title">🎨 스톡사진 (Pexels — 분위기/카테고리 참고용)</div>
        <div class="category-chip-row" id="categoryChipRow">
          <button type="button" class="category-chip category-chip-smart" id="smartCategoryChip">🎯 맞춤</button>
          <button type="button" class="category-chip" data-q="cozy cafe interior">☕ 카페</button>
          <button type="button" class="category-chip" data-q="korean bbq restaurant">🥩 고기집</button>
          <button type="button" class="category-chip" data-q="korean traditional restaurant">🍚 한식</button>
          <button type="button" class="category-chip" data-q="dessert bakery">🍰 디저트</button>
          <button type="button" class="category-chip" data-q="bar pub night">🍺 술집</button>
        </div>
        <div id="webImageArea" class="web-image-grid"></div>
      </div>
    </section>

    <section class="card">
      <h2 class="step-title">3. 가게 정보</h2>
      <label class="field">
        <span>매장명</span>
        <input type="text" id="storeName" placeholder="예: 안마을돼지불백" />
      </label>
      <label class="field">
        <span>한 줄 소개 (대표메뉴·강점·후기 아무거나)</span>
        <textarea id="introText" rows="3" placeholder="예: 20년 전통 숯불향 돼지불백, 밑반찬 리필 무한"></textarea>
      </label>
      <button type="button" class="secondary-btn" id="fetchBlogBtn">📝 블로그 후기에서 소개글 가져오기</button>
      <div id="blogCandidates" class="blog-candidates"></div>
      <button type="button" class="secondary-btn" id="blogPostBtn">✍️ 블로그 원고 자동 작성 (사장님 블로그용)</button>
      <div id="blogPostArea" class="blog-post-area"></div>
      <label class="field">
        <span>릴스 배경음악 분위기</span>
        <select id="moodSelect">
          <option value="">무음</option>
          <option value="bright">발랄한 (카페·디저트·액세서리)</option>
          <option value="calm">잔잔한 (한식·노포·공방)</option>
          <option value="trendy">트렌디한 (술집·펍·젊은 상권)</option>
        </select>
      </label>
    </section>

    <button class="cta" id="generateBtn">✨ AI로 포스터·릴스 만들기</button>

    <section class="card">
      <h2 class="step-title">리뷰 답글 자동 작성 <span class="hint">(배민·네이버 등 고객 리뷰 답글용)</span></h2>
      <label class="field">
        <span>고객이 남긴 리뷰를 붙여넣으세요</span>
        <textarea id="reviewInput" rows="3" placeholder="예: 맛있어요 근데 배달이 좀 늦었어요"></textarea>
      </label>
      <button type="button" class="secondary-btn" id="reviewReplyBtn">💬 답글 후보 만들기</button>
      <div id="reviewReplyArea" class="blog-candidates"></div>
    </section>

    <section class="card">
      <h2 class="step-title">더 만들어보기</h2>
      <button class="secondary-btn" id="cardNewsBtn">🖼️ 카드뉴스</button>
      <div id="cardNewsArea" class="card-news-grid"></div>
      <button class="secondary-btn" id="webtoonBtn">📷 포토툰</button>
      <div id="comicArea"></div>
    </section>

    <section class="card status" id="statusBox" hidden>
      <div class="spinner"></div>
      <div id="statusText">AI가 문구를 쓰는 중...</div>
    </section>

    <section class="card result" id="resultBox" hidden>
      <h2 class="step-title">완성됐어요 🎉</h2>
      <div class="result-block">
        <h3>포스터</h3>
        <div id="posterArea">준비 중...</div>
      </div>
      <div class="result-block">
        <h3>릴스 (9:16 영상)</h3>
        <div id="reelsArea">준비 중...</div>
      </div>
    </section>

    <section class="card error" id="errorBox" hidden></section>
  </main>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=q18lp57vvj&submodules=geocoder"></script>
  <script src="app.js"></script>
</body>
</html>
