<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif; }

  .poster {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #0c0c0c;
  }

  /* 액자 느낌을 주는 얇은 이중 테두리 */
  .frame {
    position: absolute;
    inset: 22px;
    border: 2px solid rgba(255,255,255,0.55);
    z-index: 6;
    pointer-events: none;
  }
  .frame::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(255,255,255,0.25);
  }

  .poster img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) saturate(1.2) brightness(0.98);
  }

  /* 하단은 진하게, 상단은 배지 가독성용으로 살짝, 가운데는 사진이 최대한 보이게 */
  .overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.62) 26%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.38) 100%);
  }
  /* 가장자리를 은은하게 눌러주는 비네트 — 사진이 더 고급스러워 보이게 */
  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 160px 40px rgba(0,0,0,0.55);
  }

  .top-area {
    position: absolute;
    top: 54px;
    left: 54px;
    right: 54px;
    z-index: 5;
  }
  .store-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.96);
    color: #14161a;
    font-weight: 800;
    font-size: 30px;
    padding: 14px 24px 14px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    letter-spacing: -0.3px;
  }
  .store-badge .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd23f, #ff8a3d);
    flex: none;
  }
  .store-meta {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(2px);
    padding: 8px 16px;
    border-radius: 999px;
  }
  .star-rating {
    color: #ffd23f;
    font-size: 20px;
    letter-spacing: 2px;
  }
  .address-text {
    color: rgba(255,255,255,0.92);
    font-size: 18px;
    font-weight: 600;
    position: relative;
    padding-left: 14px;
  }
  .address-text::before {
    content: '';
    position: absolute;
    left: 0;
    top: 3px;
    bottom: 3px;
    width: 1px;
    background: rgba(255,255,255,0.35);
  }

  .text-block {
    position: absolute;
    left: 56px;
    right: 56px;
    bottom: 74px;
    color: #fff;
    z-index: 5;
  }
  .headline {
    font-size: __HEADLINE_SIZE__px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -1px;
    white-space: pre-wrap;
    word-break: keep-all;
    text-shadow: 0 4px 18px rgba(0,0,0,0.55);
  }
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0.55), rgba(255,255,255,0));
    margin: 26px 0 20px;
  }
  .subtext {
    font-size: 30px;
    font-weight: 500;
    color: rgba(255,255,255,0.88);
    white-space: pre-wrap;
    word-break: keep-all;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .bottom-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 10px;
    background: linear-gradient(to right, #ffd23f, #ff8a3d);
    z-index: 6;
  }
</style>
</head>
<body>
  <div class="poster">
    <img src="__PHOTO__" />
    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="frame"></div>

    <div class="top-area">
      __STORE_BADGE__
      __STORE_META__
    </div>

    <div class="text-block">
      <div class="headline">__HEADLINE__</div>
      <div class="divider"></div>
      __SUBTEXT__
    </div>

    <div class="bottom-bar"></div>
  </div>
</body>
</html>
